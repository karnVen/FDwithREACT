<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Mouse Tracker</title>
    <link rel="stylesheet" href="14_ProjectMouseTracker.css">
</head>
<body>
    <h1>Simple Mouse Tracker</h1>
    <p>Move your mouse around the screen</p>

    <div class="info-box">
        <h2>Mouse Information:</h2>
        <p>X Position: <span id="mouseX">0</span> px</p>
        <p>Y Position: <span id="mouseY">0</span> px</p>
    </div>

    <div class="follower" id="follower"></div>

    <div class="color-box" id="colorBox">
        <p>This box changes color!</p>
    </div>
    
    <script src="14_ProjectMouseTracker.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="14_ProjectStudentRegistration.css">
</head>
<body>
    <div class="form-container">
        <h1>Student Registration Form</h1>
        <form>
            <label for="first">Fill User Name:</label>
            <input type="text" id="first" name="firstName" placeholder="Enter your first name">
            <label for="second">Fill last Name:</label>
            <input type="text" id="second" name="lastName" placeholder="Enter your last name">
            <label for="third">Fill Age:</label>
            <input type="number" id="third" name="age" placeholder="Enter your age">
            <button type="submit">submit</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="14_ProjectStudentRegistration.js"></script>
</body>
</html>
